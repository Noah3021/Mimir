name: CI

on:
  push:
    branches: [main]   # 只有推送到 main 才触发；其他分支的改动通过 PR 触发，避免同一份代码跑两遍
  pull_request:
  schedule:
    - cron: "0 1 * * 1"   # 每周一 01:00 UTC（北京时间 09:00），用最新依赖跑一遍
  workflow_dispatch:

# 只读权限：CI 只需要拉代码
permissions:
  contents: read

# 同一分支 / PR 有新的提交时，取消还在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt ruff
      - run: ruff check . --output-format=github

  test:
    # 按 constraints.txt 锁定的版本安装：上游发新版本不会让 CI 突然变红
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m pytest --cov --cov-report=term

  test-latest:
    # 不锁版本，安装各依赖的最新版。只在每周定时和手动触发时运行，用来提前发现上游的不兼容改动；
    # 通过后可以按 constraints.txt 开头的说明更新锁定版本。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --upgrade -r requirements-dev.txt
      - run: pip freeze
      - run: python -m pytest

  package:
    # 构建 wheel，在干净的虚拟环境里安装，确认装出来的 mimir 命令能用（默认配置已打进包里）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --wheel --outdir dist
      - name: 在干净环境中安装并运行
        env:
          MIMIR_HOME: ${{ runner.temp }}/mimir-home
          PYTHONIOENCODING: utf-8
          # 输出不是终端时 rich 按 80 列折行，“mimir init” 可能被折成两行，导致下面的 grep 匹配不到
          COLUMNS: "200"
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          "$BIN/python" -m pip install dist/*.whl -c constraints.txt
          cd "$RUNNER_TEMP"   # 离开仓库目录，确保用的是安装好的包
          "$BIN/mimir" --version
          "$BIN/mimir" init --help
          # 没有配置时 doctor 应该提示运行 mimir init，并以 1 退出
          set +e
          out=$("$BIN/mimir" doctor --offline); code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ] && echo "$out" | grep -q "mimir init"
