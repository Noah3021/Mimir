[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir-agent"
dynamic = ["version"]
description = "Mimir —— 基于 LangChain + LangGraph 的个人 CLI 智能体"
readme = "README.md"
requires-python = ">=3.11"
# 和 requirements.txt 保持一致
dependencies = [
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-deepseek>=1.0",
    "langchain-anthropic>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
mimir = "mimir.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mimir.__version__" }

[tool.setuptools.packages.find]
include = ["mimir*"]

[tool.setuptools.package-data]
mimir = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
xfail_strict = true
# 单个测试超过 60 秒判为失败（graph 涉及 interrupt / 重试，万一卡死不至于空跑到 CI 超时）
timeout = 60

[tool.coverage.run]
source = ["mimir"]
# python -m mimir 的入口只有几行，由冒烟测试在子进程里覆盖，这里统计不到
omit = ["mimir/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# 底线只升不降：2026-11-26 实测 88%，留 3 个点给不同系统 / Python 版本之间的差异
fail_under = 85

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
